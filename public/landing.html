<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriUniverse — Engineered for Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-start: #08080f;
      --bg-end: #0d0a1e;
      --accent: #7b4fff;
      --accent-hot: #c84bff;
      --text-primary: #f0eeff;
      --text-muted: #8b82b3;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: auto; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      height: 300vh;
      overflow-x: hidden;
    }

    #three-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    #hero-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .hero-eyebrow {
      position: absolute;
      left: 8vw;
      top: calc(28vh - 3rem);
      font-size: clamp(0.6rem, 1.2vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .hero-headline {
      position: absolute;
      left: 8vw;
      top: 28vh;
      max-width: 45vw;
      font-size: clamp(2.4rem, 5.8vw, 5.2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.04;
      color: var(--text-primary);
      text-shadow: 0 0 80px rgba(123, 79, 255, 0.35);
    }

    .hero-sub {
      position: absolute;
      left: 8vw;
      top: calc(28vh + clamp(2.4rem, 5.8vw, 5.2rem) * 2.2);
      max-width: 38vw;
      font-size: clamp(0.85rem, 1.4vw, 1.1rem);
      font-weight: 300;
      line-height: 1.65;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .cta-btn {
      position: absolute;
      left: 8vw;
      top: calc(28vh + clamp(2.4rem, 5.8vw, 5.2rem) * 2.2 + 5.5rem);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hot) 100%);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      pointer-events: auto;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 0 40px rgba(123, 79, 255, 0.4);
    }

    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 0 60px rgba(200, 75, 255, 0.5); }

    #scroll-hint {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .scroll-arrow {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      animation: scrollPulse 1.6s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(0.7); }
      50%       { opacity: 1;   transform: scaleY(1); }
    }

    /* Mobile overrides */
    @media (max-width: 768px) {
      .hero-headline { left: 5vw; top: 20vh; max-width: 90vw; }
      .hero-eyebrow  { left: 5vw; top: calc(20vh - 2.5rem); }
      .hero-sub      { left: 5vw; max-width: 88vw; }
      .cta-btn       { left: 5vw; }
    }
  </style>
</head>
<body>

  <canvas id="three-canvas"></canvas>

  <div id="hero-overlay">
    <span class="hero-eyebrow">NutriUniverse Labs</span>
    <h1 class="hero-headline">Engineered<br>For<br>Performance</h1>
    <p class="hero-sub">Advanced Formula. Uncompromising Results.<br>Science-backed nutrition, built for athletes.</p>
    <a href="/chat-ui" class="cta-btn">Analyze a Creator &rarr;</a>
  </div>

  <div id="scroll-hint">
    <div class="scroll-arrow"></div>
    Scroll to explore
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/scene.js"></script>
</body>
</html>
